  linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.28) calc(33.33% - .5px),rgba(255,255,255,.28) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.28) calc(66.66% - .5px),rgba(255,255,255,.28) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
  linear-gradient(transparent calc(33.33% - .5px),rgba(255,255,255,.28) calc(33.33% - .5px),rgba(255,255,255,.28) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.28) calc(66.66% - .5px),rgba(255,255,255,.28) calc(66.66% + .5px),transparent calc(66.66% + .5px))}

#af{position:absolute;left:50%;top:50%;width:46px;height:34px;margin:-17px 0 0 -23px;border:2px solid rgba(255,255,255,.75);border-radius:4px;transition:border-color .15s,transform .15s}

#date{position:absolute;right:10px;bottom:8px;font:900 15px/1 ui-monospace,Menlo,monospace;color:#ff9c3a;text-shadow:0 0 6px rgba(255,120,30,.8);letter-spacing:.08em}

@keyframes snapA{0%{opacity:0;transform:translateX(-50%) scale(.4) rotate(-10deg)}20%{opacity:1;transform:translateX(-50%) scale(1.15) rotate(-6deg)}70%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1) rotate(-6deg)}}

#ctrl{position:absolute;display:flex;align-items:center;gap:18px;pointer-events:none}

@keyframes onoA{0%{opacity:0;transform:translate(-50%,-60%) scale(.5)}15%{opacity:1;transform:translate(-50%,-100%) scale(1.12)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}

/* ---------- 結果 */
#vResult{background:radial-gradient(rgba(150,110,60,.09) 1px,transparent 1.5px) 0 0/14px 14px,linear-gradient(#f4e6cc,#e7d2ad);display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;justify-items:center;align-items:center;padding-top:max(58px,calc(env(safe-area-inset-top) + 52px))}
.rhead{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:20px;color:var(--orange-dk)}

.ph{background:#fffdf8;padding:5px 5px 0;border-radius:3px;box-shadow:0 3px 8px rgba(70,40,10,.25);position:relative;opacity:0;transform:translateY(14px) rotate(var(--r,0deg)) scale(.92);transition:opacity .35s,transform .45s cubic-bezier(.3,1.6,.5,1)}

.ph .cap{height:var(--caph,24px);display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 2px;font-weight:900;font-size:12px;line-height:1;white-space:nowrap;overflow:hidden}

.tot.on{opacity:1}
.tot small{font-size:12px;font-weight:900;color:var(--sub);letter-spacing:.14em}
.tot b{font-family:ui-monospace,Menlo,monospace;font-weight:900;font-size:clamp(24px,calc(var(--ph,100px) * .32),46px);line-height:1;color:var(--ink)}
.stamp{position:relative;margin-top:8px;font-family:var(--disp);font-size:clamp(13px,calc(var(--ph,100px) * .13),20px);line-height:1.15;color:var(--c,#d23b54);border:4px solid var(--c,#d23b54);border-radius:10px;padding:5px 8px;text-align:center;background:rgba(255,253,248,.82);transform:rotate(-9deg);opacity:0;white-space:nowrap;width:max-content}
.stamp.on{animation:stampA .4s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stampA{0%{opacity:0;transform:rotate(-9deg) scale(3)}100%{opacity:1;transform:rotate(-9deg) scale(1)}}
#rSide{width:min(560px,100%);display:flex;flex-direction:column;gap:10px}

.btn.xpost:active{box-shadow:0 1px 0 #555}

#skipHint{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:var(--sub);white-space:nowrap}
#rDev{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(40,12,8,.92);color:#ffb3a0;z-index:3;transition:opacity .5s}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:900;z-index:80;font-size:14px}

@media (min-aspect-ratio:5/4){
  #vResult{grid-template-columns:minmax(0,1fr) minmax(230px,34%);grid-template-rows:auto minmax(0,1fr);column-gap:18px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .rhead{grid-column:1/3}
  #album{grid-column:1;grid-row:2}
  #rSide{grid-column:2;grid-row:2}
  #rBtns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"again again" "save x" "title title";gap:8px}
  .rRow{display:contents}
  #bAgain{grid-area:again}#bSave{grid-area:save}#bX{grid-area:x}#bTitle{grid-area:title}
  #rBtns .r2 .btn{padding:0 6px;gap:6px}
  #rBtns #bSave svg{display:none}
}
@media (max-height:700px){
  .logo .mark{width:66px;height:52px}
  .logo .l1{font-size:22px}
  .sub{font-size:13px;padding:6px 12px}
  .tbtns{gap:9px}
  .btn{min-height:48px;font-size:16px}.btn.main{min-height:54px;font-size:18px}
  .card svg{width:60px;height:44px}
  .card p{font-size:11.5px}
  #vHow{gap:8px}
  #vHow h2{font-size:21px}
  #rSide{gap:7px}#rBtns{gap:8px}#rBtns .btn{min-height:44px}
}
/* X のアプリの中で背の低い縦画面: 下の帯（--inapp-bot）の分、写真の段を残して見出しと編集長のひとことを外す */
@media (max-height:640px) and (orientation:portrait){
  html.inapp-x #vResult{padding-top:max(50px,calc(env(safe-area-inset-top) + 44px));gap:6px}
  html.inapp-x #vResult .rhead{display:none}
  html.inapp-x #editor{display:none}
}
@media (max-height:560px) and (orientation:landscape){
  #vTitle{flex-direction:row;flex-wrap:wrap;align-content:space-between;justify-content:center;column-gap:24px;row-gap:8px;padding-top:50px}
  #vTitle .logo{width:100%;margin-bottom:0}
  #vTitle{background:linear-gradient(rgba(255,240,215,0) 30%,rgba(255,240,215,.6) 60%,rgba(243,226,196,.94))}
  .logo .mark{display:none}
  .logo .l2{font-size:44px}
  .sub{max-width:46%}
  .tbtns{width:min(300px,44%);margin:0}
  .cats{display:none}
  .cards{grid-template-columns:repeat(4,1fr);width:min(860px,100%)}
  .card{padding:8px 6px}
  #vHow{padding-top:46px}
  #vHow h2{font-size:18px}
  .rhead{font-size:16px}
  #vResult{padding-top:max(50px,calc(env(safe-area-inset-top) + 44px));gap:6px}
  .editor .bubble{font-size:12.5px}
  .editor svg{width:44px;height:44px}
  #rBtns .btn{min-height:42px;font-size:14px}#rBtns .btn.main{font-size:15px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="corner">
  <button id="bLang" aria-label="language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span id="langTxt">EN</span></button>
  <button id="bMute" aria-label="sound"><svg id="icOn" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><svg id="icOff" viewBox="0 0 24 24" hidden><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
</div>

<main id="vTitle" class="view">
  <div class="logo">
    <svg class="mark" viewBox="0 0 110 88"><path d="M24 30l7-22 15 16h18l15-16 7 22z" fill="#e8953f" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M33 22l-2-7 6 6zM77 22l2-7-6 6z" fill="#ffc0a8"/><rect x="8" y="26" width="94" height="58" rx="14" fill="#2b2320" stroke="#fff" stroke-width="4"/><rect x="18" y="20" width="18" height="10" rx="3" fill="#2b2320" stroke="#fff" stroke-width="3"/><circle cx="55" cy="55" r="22" fill="#fff7ea"/><circle cx="55" cy="55" r="15" fill="#3b3030"/><circle cx="55" cy="55" r="9" fill="#ff8a3d"/><circle cx="50" cy="50" r="3.5" fill="#fff"/><circle cx="88" cy="38" r="4" fill="#ff8a3d"/></svg>
    <span class="l1" id="tl1">ねこ</span><span class="l2" id="tl2">カメラマン</span>
  </div>
  <p class="sub" id="tSub"></p>
  <div class="cats" id="catChips"></div>
  <div class="tbtns">
    <button class="btn main" id="bStart"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.6"/><path d="M8 7l1.5-2.5h5L16 7"/></svg><span id="tStart"></span></button>
    <button class="btn" id="bHow"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.6V14"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg><span id="tHow"></span></button>
  </div>
</main>

<main id="vHow" class="view" hidden>
  <h2 id="hT"></h2>
  <div class="cards">
    <div class="card"><svg viewBox="0 0 74 56"><rect x="14" y="8" width="46" height="40" rx="4" fill="none" stroke="#2b2320" stroke-width="3" stroke-dasharray="7 5"/><path d="M8 28h10M56 28h10" stroke="#ff8a3d" stroke-width="4" stroke-linecap="round"/><path d="M12 22l-6 6 6 6M62 22l6 6-6 6" fill="none" stroke="#ff8a3d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="37" cy="28" r="7" fill="#e8953f"/></svg><b id="h1t"></b><p id="h1"></p></div>
    <div class="card"><svg viewBox="0 0 74 56"><circle cx="37" cy="28" r="20" fill="#ff8a3d" stroke="#fff" stroke-width="4"/><circle cx="37" cy="28" r="23" fill="none" stroke="#2b2320" stroke-width="2.5"/><rect x="27" y="22" width="20" height="14" rx="3" fill="none" stroke="#fff" stroke-width="3"/><circle cx="37" cy="29" r="3.5" fill="none" stroke="#fff" stroke-width="2.5"/><g fill="#ff8a3d"><rect x="2" y="44" width="5" height="8" rx="1"/><rect x="9" y="44" width="5" height="8" rx="1"/><rect x="60" y="44" width="5" height="8" rx="1"/><rect x="67" y="44" width="5" height="8" rx="1"/></g></svg><b id="h2t"></b><p id="h2"></p></div>
    <div class="card"><svg viewBox="0 0 74 56"><path d="M20 30l4-18 10 10h6l10-10 4 18z" fill="#e8953f"/><ellipse cx="37" cy="36" rx="19" ry="15" fill="#e8953f"/><circle cx="30" cy="35" r="2.6" fill="#2b2320"/><circle cx="44" cy="35" r="2.6" fill="#2b2320"/><path d="M34 41q3 2 6 0" fill="none" stroke="#2b2320" stroke-width="2" stroke-linecap="round"/><path d="M14 8l4 6M10 16l6 2M60 8l-4 6M64 16l-6 2" stroke="#d6334a" stroke-width="3" stroke-linecap="round"/></svg><b id="h3t"></b><p id="h3"></p></div>
    <div class="card"><svg viewBox="0 0 74 56"><g opacity=".35"><ellipse cx="30" cy="30" rx="13" ry="11" fill="#2b2320"/></g><g opacity=".6"><ellipse cx="36" cy="30" rx="13" ry="11" fill="#2b2320"/></g><ellipse cx="42" cy="30" rx="13" ry="11" fill="#2b2320"/><path d="M33 22l2-9 6 6zM51 22l-2-9-6 6z" fill="#2b2320"/><path d="M6 20h12M4 30h12M6 40h12" stroke="#d6334a" stroke-width="3" stroke-linecap="round"/></svg><b id="h4t"></b><p id="h4"></p></div>
  </div>
  <p class="rule" id="hRule"></p>
  <div class="row"><button class="btn" id="bHowBack"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span id="tBack"></span></button><button class="btn main" id="bHowGo"><span id="tGo"></span></button></div>
</main>

<main id="vPlay" class="port" hidden>
  <div id="frame">
    <div class="gl3"></div><i class="cn a"></i><i class="cn b"></i><i class="cn c"></i><i class="cn d"></i>
    <div id="af"></div>
    <div id="lcd"><span id="lcdZoom">x1</span><span>ISO400</span></div>
    <div id="date"></div>
    <div id="flash"></div>
    <div id="snapTxt"></div>
  </div>
  <div id="hud">
    <div class="pill" id="timer"><small id="tTime"></small><b id="tSec">60</b></div>
    <div class="pill" id="films"><small id="tFilm"></small><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div id="ctrl">
    <div id="thumb"><canvas width="96" height="96"></canvas></div>
    <button id="bShutter" aria-label="shutter"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.6"/><path d="M8 7l1.5-2.5h5L16 7"/></svg></button>
    <button id="bZoom" aria-label="zoom"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="15" cy="15" r="9"/><path d="M22 22l8 8"/><text id="zTxt" x="15" y="19.5" text-anchor="middle" font-size="11" font-weight="900" fill="currentColor" stroke="none" font-family="ui-monospace,Menlo,monospace">2x</text></svg></button>
  </div>
  <div id="fxl"></div>
  <div id="hint" hidden><svg viewBox="0 0 30 22"><path d="M4 18l3-14 6 6h4l6-6 3 14z" fill="#e8953f"/><path d="M2 3l3 3M28 3l-3 3" stroke="#d6334a" stroke-width="2.4" stroke-linecap="round"/></svg><span id="tHint"></span></div>
  <div id="count" hidden></div>
</main>

<main id="vResult" class="view" hidden>
  <div class="rhead"><svg viewBox="0 0 28 28"><rect x="3" y="6" width="22" height="17" rx="2" fill="#fffdf8" stroke="#b9541a" stroke-width="2.4"/><circle cx="14" cy="14.5" r="4" fill="none" stroke="#b9541a" stroke-width="2.4"/><path d="M5 3h18" stroke="#b9541a" stroke-width="2.4" stroke-linecap="round"/></svg><span id="rT"></span></div>
  <div id="album">
    <div id="grid"></div>
    <div id="skipHint"></div>
    <div id="rDev"><svg viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" fill="none" stroke="#ffb3a0" stroke-width="4"/><circle cx="35" cy="35" r="6" fill="#ffb3a0"/><g fill="#ffb3a0"><circle cx="35" cy="16" r="7"/><circle cx="35" cy="54" r="7"/><circle cx="16" cy="35" r="7"/><circle cx="54" cy="35" r="7"/></g></svg><b id="tDev"></b><small id="tDevSub"></small></div>
  </div>
  <div id="rSide">
    <div class="editor" id="editor"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="26" fill="#ffe2c4" stroke="#2b2320" stroke-width="2.5"/><path d="M6 22c2-14 14-19 23-18 11 1 19 8 19 18-6-5-14-7-21-6-7 0-14 2-21 6z" fill="#3b2b26"/><circle cx="19" cy="29" r="6" fill="#fff" stroke="#2b2320" stroke-width="2.4"/><circle cx="35" cy="29" r="6" fill="#fff" stroke="#2b2320" stroke-width="2.4"/><path d="M25 29h4" stroke="#2b2320" stroke-width="2.4"/><circle id="eyeL" cx="19" cy="29.5" r="2" fill="#2b2320"/><circle id="eyeR" cx="35" cy="29.5" r="2" fill="#2b2320"/><path id="edMouth" d="M21 41q6 4 12 0" fill="none" stroke="#2b2320" stroke-width="2.6" stroke-linecap="round"/><path d="M40 6l4-4 3 6" fill="#d6334a"/></svg><div class="bubble"><small id="edName"></small><span id="edTxt"></span></div></div>
    <div id="rBtns">
      <div class="rRow r1">
        <button class="btn main" id="bAgain"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg><span id="tAgain"></span></button>
        <button class="btn" id="bTitle"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg><span id="tTitle"></span></button>
      </div>
      <div class="rRow r2">
        <button class="btn teal" id="bSave"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span id="tSave"></span></button>
        <button class="btn xpost" id="bX"><svg class="xlogo" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg><span id="tPost"></span></button>
      </div>
    </div>
  </div>
</main>

<script>
// ブラウザの拡大を止める（ピンチ・ダブルタップ・トラックパッドのピンチ・Ctrl+ホイール/キー）。iOS は user-scalable=no を無視するので JS でも止める
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
// 起動失敗の保険。5秒たって window.__ncReady が立っていなければ原因と UA を画面に出す
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__ncReady) return;
    var d=document.createElement('div');d.id='boot-err';d.style.cssText='position:fixed;inset:auto 8px 8px 8px;z-index:99;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px;border-radius:8px';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },5000);
})();
</script>
